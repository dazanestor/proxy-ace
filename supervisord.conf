[supervisord]
nodaemon=true

[program:acestream]
command=/run.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/acestream.log
stderr_logfile=/var/log/acestream.err.log

[program:runsvdir]
command=runsvdir /app
autostart=true
autorestart=true
stdout_logfile=/var/log/runsvdir.log
stderr_logfile=/var/log/runsvdir.err.log

[program:apache2]
command=/usr/sbin/apachectl -D FOREGROUND
autostart=true
autorestart=true
stdout_logfile=/var/log/apache2.log
stderr_logfile=/var/log/apache2.err.log

[program:cron]
command=cron -f
autostart=true
autorestart=true
stdout_logfile=/var/log/cron.log
stderr_logfile=/var/log/cron.err.log
